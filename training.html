<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23e8505b'/%3E%3Cpath d='M58 92l22 22 42-48' fill='none' stroke='%23ffffff' stroke-width='18' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Daily Training</title>
<style>
/* Sunset theme. Light is the default; dark is opt-in from Settings. */
:root{
  --bg:#fff8f1;--sky:#ffe2cc;--card:#ffffff;--text:#2b1820;--muted:#6e4d57;--line:#e6cfc6;--soft:#fbeee6;
  --home:#b4234a;--home-t:#fde9ee;
  --gym:#5a2fa0;--gym-t:#efe9fb;
  --cond:#b3400b;--cond-t:#fdebe0;
  --nut:#855500;--nut-t:#fcf1d9;
  --chk:#97186a;--chk-t:#fbe7f3;
  --rest:#4b4f78;--rest-t:#edeef6;
  --on-accent:#ffffff;--danger:#b42318;
  --sun1:#f59e0b;--sun2:#e8505b;--sun3:#6d28d9;
  color-scheme:light;
}
:root[data-theme="dark"]{
    --bg:#160d13;--sky:#3b1c2c;--card:#241821;--text:#fbeff1;--muted:#cdb5be;--line:#55404b;--soft:#34232d;
    --home:#fda4b8;--home-t:#3a1a24;
    --gym:#c9b6ff;--gym-t:#261d40;
    --cond:#fdba8c;--cond-t:#3a2216;
    --nut:#fcd36b;--nut-t:#33280f;
    --chk:#f7a8d8;--chk-t:#3a1730;
    --rest:#c3c7e8;--rest-t:#252840;
    --on-accent:#1a1016;--danger:#fca5a5;
    --sun1:#fcd36b;--sun2:#fb8a7e;--sun3:#c9b6ff;
    color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
    --bg:#160d13;--sky:#3b1c2c;--card:#241821;--text:#fbeff1;--muted:#cdb5be;--line:#55404b;--soft:#34232d;
    --home:#fda4b8;--home-t:#3a1a24;
    --gym:#c9b6ff;--gym-t:#261d40;
    --cond:#fdba8c;--cond-t:#3a2216;
    --nut:#fcd36b;--nut-t:#33280f;
    --chk:#f7a8d8;--chk-t:#3a1730;
    --rest:#c3c7e8;--rest-t:#252840;
    --on-accent:#1a1016;--danger:#fca5a5;
    --sun1:#fcd36b;--sun2:#fb8a7e;--sun3:#c9b6ff;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  font-size:18px;line-height:1.4;color:var(--text);
  background:var(--bg) linear-gradient(180deg,var(--sky) 0,var(--bg) 440px) no-repeat;
  -webkit-tap-highlight-color:transparent;min-height:100vh;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--text);outline-offset:2px}
#app{max-width:1120px;margin:0 auto}
.ico{width:24px;height:24px;flex:none}
.c-home{--c:var(--home);--ct:var(--home-t)}
.c-gym{--c:var(--gym);--ct:var(--gym-t)}
.c-cond{--c:var(--cond);--ct:var(--cond-t)}
.c-nut{--c:var(--nut);--ct:var(--nut-t)}
.c-chk{--c:var(--chk);--ct:var(--chk-t)}
.c-rest{--c:var(--rest);--ct:var(--rest-t)}

/* Header */
.top{display:flex;align-items:center;gap:16px;padding:6px 2px 18px}
.top-text{flex:1;min-width:0}
.date{color:var(--muted);font-weight:700}
.top h1{font-size:30px;line-height:1.15;margin:6px 0 4px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--c);color:var(--on-accent);padding:6px 16px 6px 12px;border-radius:999px;font-size:24px;font-weight:800}
.pill .ico{width:26px;height:26px}
.meta{color:var(--muted)}
.ring{position:relative;width:80px;height:80px;flex:none;color:var(--c)}
.ring svg{width:100%;height:100%;display:block}
.ring-bg{fill:none;stroke:var(--soft);stroke-width:7}
.ring-fg{fill:none;stroke:url(#sunset);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring-t{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--text)}
.icon-btn{width:48px;height:48px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);font:italic 800 22px Georgia,"Times New Roman",serif;flex:none}

/* Cards */
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:16px;border-top:6px solid var(--c,var(--line));box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-h{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800;margin-bottom:12px}
.badge{width:40px;height:40px;border-radius:12px;background:var(--c);color:var(--on-accent);display:grid;place-items:center;flex:none}
.count{margin-left:auto;font-size:18px;font-weight:800;background:var(--soft);padding:4px 12px;border-radius:999px;white-space:nowrap}
.note{color:var(--muted);margin:2px 0 10px}
.foot{margin-top:12px}
.cols.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}

/* Checklist items */
.list{list-style:none;display:flex;flex-direction:column;gap:8px}
.item{border-radius:14px;background:var(--ct)}
.row{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;padding:12px 14px;min-height:60px;border-radius:14px}
.box{width:32px;height:32px;border-radius:10px;border:2.5px solid var(--c);display:grid;place-items:center;flex:none;background:var(--card)}
.box .ico{width:22px;height:22px;stroke-width:3;opacity:0;color:var(--on-accent)}
.done .box{background:var(--c)}
.done .box .ico{opacity:1}
.txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.nm{font-weight:800}
.dose{font-weight:600}
.cue{color:var(--muted)}
.item.done{background:var(--soft)}
.item.done .nm,.item.done .dose{color:var(--muted)}
.item.done .nm{text-decoration:line-through;text-decoration-thickness:2px}
.rowwrap{display:flex;align-items:flex-start}
.rowwrap .row{flex:1;min-width:0}
.howbtn{flex:none;margin:10px 10px 0 0;min-height:44px;padding:0 14px 0 10px;border-radius:999px;border:2px solid var(--c);background:var(--card);color:var(--text);font-weight:800;font-size:16px;display:inline-flex;align-items:center;gap:4px}
.howbtn .ico{width:18px;height:18px;color:var(--c)}
ol.how{margin:16px 0 18px 1.3em;display:flex;flex-direction:column;gap:10px}
ol.how li{padding-left:4px}
a.main{text-decoration:none}
.swap{display:flex;gap:4px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:4px;margin:0 0 14px;max-width:440px}
.swap button{flex:1;min-height:46px;border-radius:999px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--muted)}
.swap button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.swap .ico{width:20px;height:20px}
.lrow{cursor:default}
#app .card[id^="lib-"]{scroll-margin-top:12px}
.lnum{width:32px;height:32px;border-radius:50%;background:var(--c);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.lrow .last{margin-top:4px;font-size:17px}
.tag{font-size:15px;font-weight:800;color:var(--muted);border:1.5px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px;text-decoration:none;display:inline-block}
.just .box{animation:pop .32s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}

/* Exercise rows */
.ex-ctrl{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:0 14px 14px 60px}
.item.ex.done .ex-ctrl{display:none}
.sets{display:flex;gap:10px;flex-wrap:wrap}
.bub{width:48px;height:48px;border-radius:50%;border:2.5px solid var(--c);background:var(--card);font-weight:800;display:grid;place-items:center}
.bub.on{background:var(--c);color:var(--on-accent)}
.bub .ico{width:24px;height:24px;stroke-width:3}
.wt{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.last{color:var(--muted);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.up{display:inline-flex;align-items:center;gap:2px;color:var(--text);font-weight:800}
.up .ico{width:18px;height:18px}
.step{display:flex;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.step button{width:48px;height:48px;font-size:26px;font-weight:700}
.step input{width:76px;height:48px;border:0;text-align:center;font-weight:800;background:transparent;-webkit-appearance:none;appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.unit{color:var(--muted);padding-right:2px}
.chip{min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);font-weight:800;font-size:17px;background:var(--card);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--c);border-color:var(--c);color:var(--on-accent)}
.chip .ico{width:18px;height:18px;stroke-width:3}

/* Buttons */
.main{min-height:52px;padding:12px 22px;border-radius:14px;background:var(--c);color:var(--on-accent);font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.minor{min-width:52px;min-height:52px;border-radius:14px;background:var(--soft);font-weight:800;font-size:24px}
.ghost{min-height:50px;padding:10px 18px;border-radius:14px;border:1.5px solid var(--line);font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--card)}
.block{width:100%}
.main.on{background:var(--soft);color:var(--text)}
@media (prefers-reduced-motion: no-preference){button:active{transform:scale(.97)}}

/* Nutrition */
.nrow{padding:14px 0;border-top:1px solid var(--line)}
.nrow:first-of-type{border-top:0;padding-top:4px}
.nhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.val{font-weight:800;font-size:22px}
.goal{color:var(--muted)}
.mk{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--c);display:grid;place-items:center;flex:none}
.mk .ico{width:18px;height:18px;stroke-width:3;opacity:0;color:var(--on-accent)}
.mk.on{background:var(--c)}
.mk.on .ico{opacity:1}
.bar{position:relative;height:12px;border-radius:6px;background:var(--soft);margin:12px 0}
.bar span{display:block;height:100%;border-radius:6px;background:var(--c);transition:width .3s}
.bar i{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--text);border-radius:2px}
.nctrl{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}

/* Check-in */
.sl{margin:4px 0 14px}
.sl-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.sl-h output{font-size:24px;font-weight:800}
.slider{position:relative;height:52px;touch-action:pan-y;cursor:pointer;outline:none}
.slider .track{position:absolute;left:22px;right:22px;top:22px;height:8px;border-radius:4px;background:var(--soft)}
.slider .fill{height:100%;width:calc(var(--v) * 10%);background:var(--c);border-radius:4px}
.slider .thumb{position:absolute;top:10px;left:calc(22px + (100% - 44px) * var(--v) / 10 - 16px);width:32px;height:32px;border-radius:50%;background:var(--card);border:3px solid var(--c);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.slider.hi .thumb{border-width:8px}
.slider:focus-visible .thumb{outline:3px solid var(--text);outline-offset:2px}
.ticks{display:flex;justify-content:space-between;padding:0 15px;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.ticks span{width:14px;text-align:center}
.warn{background:var(--cond-t);border-left:6px solid var(--cond);padding:12px 14px;border-radius:10px;font-weight:700;margin:4px 0 12px;color:var(--text)}
.warn[hidden]{display:none}
.weigh{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 16px}
.weigh .wh{grid-column:1/-1;display:flex;gap:10px;align-items:center;font-weight:800}
.fld{display:flex;flex-direction:column;gap:6px;font-weight:700}
.inp{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:var(--card)}
.inp input{border:0;background:transparent;height:52px;width:100%;font-weight:800;min-width:0}
.inp span{color:var(--muted)}

/* Banners */
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;margin-bottom:16px;background:var(--card);font-weight:800;border:2.5px solid var(--c)}
.banner .ico{color:var(--c)}

/* Week */
.wk-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.wk-h h2{font-size:22px}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0;border-radius:12px;min-height:44px}
.wd{font-size:15px;font-weight:800;color:var(--muted)}
.dot{width:44px;height:44px;border-radius:50%;border:3px solid var(--c);display:grid;place-items:center;color:var(--on-accent);flex:none}
.dot .ico{width:24px;height:24px;stroke-width:3}
.st-done{background:var(--c)}
.st-part{background:linear-gradient(to top,var(--c) 50%,transparent 50%)}
.st-up{border-style:dashed;border-color:var(--muted)}
.st-moved{border-style:dashed;color:var(--c)}
.is-today .dot{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--text)}
.lbl{font-size:15px;font-weight:800;text-align:center;line-height:1.2}
.legend{display:flex;flex-wrap:wrap;gap:14px 24px}
.lg{display:flex;align-items:center;gap:10px;font-weight:700}
.lg .dot{width:32px;height:32px}
.lg .dot .ico{width:18px;height:18px}
.hint{color:var(--muted);margin-top:8px}

/* Progress */
.charts{display:grid;gap:16px}
.charts.two{grid-template-columns:1fr 1fr}
.charts .card{margin-bottom:0}
.ch-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.ch-h h3{font-size:20px}
.latest{font-weight:800}
.chart{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font-size:13px;font-family:inherit}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--c);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--card);stroke:var(--c);stroke-width:2.5}
.chart .th{stroke:var(--cond);stroke-dasharray:5 5;stroke-width:2}
.empty{color:var(--muted)}

/* Settings */
.field{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.field > .fl{font-weight:800}
.ctl{min-height:52px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:var(--card);width:100%;max-width:380px;-webkit-appearance:none;appearance:none}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.danger{color:var(--danger);border-color:var(--danger)}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}

/* Tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;gap:6px;
  padding:6px max(12px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  background:var(--card);background:color-mix(in srgb,var(--card) 90%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
#tabs button{flex:1;max-width:200px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:16px;font-weight:800;color:var(--muted);border-radius:14px}
#tabs button[aria-current="page"]{color:var(--text);background:var(--soft)}

/* Sheet, toast, celebration */
#sheet{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px}
#sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet-panel{position:relative;background:var(--card);border-radius:22px;padding:24px;max-width:580px;width:100%;max-height:86vh;overflow:auto}
.sheet-panel h2{font-size:26px;margin-bottom:6px}
.rule{display:flex;gap:14px;margin:16px 0;align-items:flex-start}
.rule p{margin-top:2px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:800;z-index:40;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.celebrate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.3);padding:20px}
.cel-card{background:var(--card);border-top:8px solid var(--sun2);border-radius:24px;padding:28px 40px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:rise .35s ease}
.cel-big{font-size:32px;font-weight:800;margin-bottom:4px}
.conf{position:fixed;top:-24px;width:10px;height:16px;border-radius:3px;background:var(--c);animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(560deg)}}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:600px){.ex-ctrl{padding-left:14px}.top h1{font-size:26px}.pill{font-size:21px}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs" aria-label="Sections"></nav>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
(() => {
'use strict';
const KEY = 'dailyTrainer.v1';
const DAY = 86400000;
const $ = s => document.querySelector(s);
const app = $('#app'), sheet = $('#sheet');
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
const landscape = matchMedia('(orientation: landscape) and (min-width: 960px)');
const PAIN_MSG = 'Above 3 today: lower the weight, shorten the range, or swap the exercise.';
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

/* ---------- Dates (local calendar days) ---------- */
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => keyOf(new Date());
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const dayNum = k => { const [y, m, d] = k.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / DAY); };
const keyFromNum = n => { const d = new Date(n * DAY); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };

  const g = [
    { key: 'home', title: 'Home routine', sub: 'Every day', cat: 'home', ic: 'home', items: HOME },
    { key: 'warm', title: 'Lift day warm-up', sub: 'Before Workout A or B', cat: 'gym', ic: 'gym', items: [
      { id: 'g_warm', n: 'Warm-up', d: 'Bike 5 to 8 min, then wall sit 2 × 30 sec' },
      { id: 'g_cool', n: 'Easy bike', d: '10 min after lifting', optional: true }] },
    { key: 'A', title: 'Workout A', sub: p2 ? 'Main lifts 6 to 10 reps' : 'Main lifts 10 to 12 reps', cat: 'gym', ic: 'gym', items: workout('A', ph).map(asItem) },
    { key: 'B', title: 'Workout B', sub: p2 ? 'Main lifts 6 to 10 reps' : 'Main lifts 10 to 12 reps', cat: 'gym', ic: 'gym', items: workout('B', ph).map(asItem) }
  ];
  if (p2) g.push({ key: 'impact', title: 'Impact work', sub: 'After the warm-up on lift days. Move up only if knee and ankles are 3/10 or less the next morning.', cat: 'cond', ic: 'cond',
    items: [[5, 'Weeks 5 to 6'], [7, 'Weeks 7 to 8'], [9, 'Weeks 9 to 10']].map(([w, l], i) => { const im = impact(w); return { id: 'imp' + i, n: im.n, d: im.d, cue: l, how: im.how }; }) });
  g.push({ key: 'cond', title: 'Conditioning', sub: p2 ? 'On the bike. Pool is still fine on easy days.' : 'Tuesday and Thursday', cat: 'cond', ic: 'cond',
    items: p2 ? [[5, 'Weeks 5 to 6'], [7, 'Weeks 7 to 8'], [9, 'Weeks 9 to 10']].map(([w, l], i) => { const c = conditioning(2, w); return { id: 'cnd' + i, n: c.n, d: c.d, cue: l }; })
              : [{ id: 'cnd0', ...conditioning(1, 1) }] });
  g.push({ key: 'class', title: 'Muay Thai days', sub: 'Phase 3', cat: 'cond', ic: 'glove', items: [{ id: 'g_wrap', n: 'Wrap hands, use the thumb loop' }] });
  return g;
}

/* Today */

  const metaTxt = k < data.settings.startDate ? `Plan starts ${fmtShort(data.settings.startDate)}` : `Week ${w} · Phase ${ph}${ph === 3 ? ': Muay Thai' : ''}`;

      <span class="ring-t" aria-hidden="true">${p.done}/${p.total}</span>

  if (p.total && p.done >= p.total) {
    const n = streak(k);
    h += `<div class="banner c-nut" role="status">${icon('check')}<span>All done${isToday ? ' today' : ''}. ${n > 1 ? `${n} days in a row.` : 'Nice work.'}</span></div>`;
  }

function sortItems(items, r) {
  return items.map((it, i) => ({ it, i, d: isDoneItem(it, r) ? 1 : 0, o: it.optional ? 1 : 0 }))
    .sort((a, b) => (a.d - b.d) || (a.o - b.o) || (a.i - b.i)).map(x => x.it);
}

    <button class="row" data-act="toggle" data-id="${it.id}" aria-pressed="${done}">

    </button>${howBtn(it)}</div></li>`;
}
function howBtn(it) {

}

/* Week */
function dayStatus(k, t) {
  if (k > t) return 'up';
  const si = sessionInfo(k), r = data.days[k];
  let st = 'none';
  if (r) { const p = progress(k); st = p.done >= p.total ? 'done' : p.done > 0 ? 'part' : 'none'; }
  if (si.type === 'moved' && st !== 'done') return 'moved';
  return st;
}
function viewWeek() {
  const s = data.settings, t = todayKey();
  let h = `<header class="top"><div class="top-text"><h1>Week</h1><p class="meta">Tap a day to see it or fill it in.</p></div></header>`;
  if (t < s.startDate) return h + `<section class="card c-rest"><p>Your plan starts ${fmtLong(s.startDate)}.</p></section>`;
  const words = { done: 'done', part: 'partly done', none: 'not logged', up: 'coming up', moved: 'moved' };
  for (let w = weekOf(t); w >= 1; w--) {
    const first = addDays(s.startDate, (w - 1) * 7);
    let cells = '', dn = 0;
    for (let i = 0; i < 7; i++) {
      const k = addDays(first, i), si = sessionInfo(k), st = dayStatus(k, t);
      if (st === 'done') dn++;
      const inner = st === 'done' ? icon('check') : st === 'moved' ? icon('arrow') : '';
      const stWord = k === t && st === 'none' ? 'today' : words[st];
      cells += `<button class="cell c-${si.cat}${k === t ? ' is-today' : ''}" data-act="openday" data-date="${k}" aria-label="${fmtShort(k)}, ${si.label}, ${stWord}">
        <span class="wd">${parseKey(k).toLocaleDateString(undefined, { weekday: 'short' })}</span>
        <span class="dot st-${st}">${inner}</span>
        <span class="lbl">${si.short}</span></button>`;
    }
    h += `<section class="card"><div class="wk-h"><h2>Week ${w}</h2><span class="meta">Phase ${phaseOf(first)}</span>${dn ? `<span class="meta">${dn} done</span>` : ''}</div><div class="dots">${cells}</div></section>`;
  }
  h += `<section class="card"><h2 class="card-h">Key</h2><div class="legend">
    <span class="lg c-rest"><span class="dot st-done">${icon('check')}</span>Done</span>
    <span class="lg c-rest"><span class="dot st-part"></span>Partly done</span>
    <span class="lg c-rest"><span class="dot"></span>Not logged</span>
    <span class="lg"><span class="dot st-up"></span>Coming up</span>
    <span class="lg c-rest"><span class="dot st-moved">${icon('arrow')}</span>Moved</span>
  </div><p class="hint">Dot color matches the session: purple lift, orange cardio or class, dusk blue rest or walk. The label under each dot says which.</p></section>`;
  return h;
}

/* Progress */
function chart(title, unit, pts, cls, fixed) {
  const last = pts[pts.length - 1];
  const u = unit === '/10' ? '/10' : ' ' + unit;
  let body;
  if (pts.length < 2) {
    body = `<p class="empty">${pts.length ? `One entry so far: ${last.v}${u}. The line appears after the next one.` : 'Nothing logged yet. The line appears after two entries.'}</p>`;
  } else {
    const W = 340, H = 170, L = 40, R = 14, T = 14, B = 28;
    const xs = pts.map(p => dayNum(p.k)), x0 = xs[0], x1 = xs[xs.length - 1];
    let lo = fixed ? fixed[0] : Math.min(...pts.map(p => p.v)), hi = fixed ? fixed[1] : Math.max(...pts.map(p => p.v));
    if (!fixed) { const padv = (hi - lo) * 0.15 || Math.max(1, Math.abs(hi) * 0.03); lo -= padv; hi += padv; }
    const X = n => L + (x1 === x0 ? 0.5 : (n - x0) / (x1 - x0)) * (W - L - R);
    const Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${X(xs[i]).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
    const dotsSvg = pts.length <= 40 ? pts.map((p, i) => `<circle class="pt" cx="${X(xs[i]).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.5"/>`).join('') : '';
    const th = fixed ? `<line class="th" x1="${L}" x2="${W - R}" y1="${Y(3)}" y2="${Y(3)}"/><text class="ax" x="${W - R}" y="${Y(3) - 4}" text-anchor="end">3</text>` : '';
    body = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}: ${pts.length} entries, latest ${last.v}${u}">
      <line class="gl" x1="${L}" x2="${W - R}" y1="${T}" y2="${T}"/><line class="gl" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>
      <text class="ax" x="${L - 6}" y="${T + 4}" text-anchor="end">${round1(hi)}</text>
      <text class="ax" x="${L - 6}" y="${H - B + 4}" text-anchor="end">${round1(lo)}</text>
      <text class="ax" x="${L}" y="${H - 8}">${fmtMD(pts[0].k)}</text>
      <text class="ax" x="${W - R}" y="${H - 8}" text-anchor="end">${fmtMD(last.k)}</text>
      ${th}<path class="ln" d="${d}"/>${dotsSvg}</svg>`;
  }
  return `<section class="card ${cls}"><div class="ch-h"><h3>${title}</h3>${pts.length ? `<span class="latest">${last.v}${u}</span>` : ''}</div>${body}</section>`;
}
function viewProgress() {

  h += `<section class="card c-cond">${cardHead('cond', 'glove', 'Muay Thai readiness', rd, READY.length)}
    ${rd === READY.length ? `<p class="note">All six done. Switch to Phase 3 in Settings when classes start.</p>` : ''}
    <ul class="list">${READY.map(([id, n]) => { const d = data.readiness[id]; return `<li class="item${d ? ' done' : ''}">
      <button class="row" data-act="ready" data-id="${id}" aria-pressed="${!!d}"><span class="box">${icon('check')}</span>
      <span class="txt"><span class="nm">${n}</span>${d ? `<span class="cue">Done ${fmtMD(d)}</span>` : ''}</span></button></li>`; }).join('')}</ul>
  </section>`;
  const S = fn => sortedKeys().map(k => ({ k, v: fn(data.days[k]) })).filter(p => typeof p.v === 'number' && isFinite(p.v));
  const lift = id => r => (r.wt && r.wt[id] > 0 ? r.wt[id] : undefined);
  const charts = [
    chart('Body weight', 'lb', S(r => r.bw), 'c-chk'),
    chart('Waist', 'in', S(r => r.waist), 'c-chk'),
    chart('Left knee pain', '/10', S(r => (r.pain ? r.pain.knee : undefined)), 'c-chk', [0, 10]),
    chart('Thumb pain', '/10', S(r => (r.pain ? r.pain.thumb : undefined)), 'c-chk', [0, 10]),
    chart('Leg press', 'lb', S(lift('leg_press')), 'c-gym'),
    chart('Chest press', 'lb', S(lift('chest_press')), 'c-gym'),
    chart('Seated row', 'lb', S(lift('row')), 'c-gym'),
    chart('Lat pulldown', 'lb', S(lift('pulldown')), 'c-gym')
  ];
  return h + `<div class="charts${landscape.matches ? ' two' : ''}">${charts.join('')}</div>`;
}

/* Settings */
function viewSettings() {
  const s = data.settings, mode = modeFor(todayKey());
  const seg = [['auto', 'Auto'], ['1', 'Phase 1'], ['2', 'Phase 2'], ['3', 'Phase 3: Muay Thai']]
    .map(([v, l]) => `<button class="chip${mode === v ? ' on' : ''}" data-act="phase" data-v="${v}" aria-pressed="${mode === v}">${mode === v ? icon('check') : ''}${l}</button>`).join('');
  const cls = [2, 3, 4, 6, 0].map(d => { const on = s.classDays.includes(d); return `<button class="chip${on ? ' on' : ''}" data-act="classday" data-v="${d}" aria-pressed="${on}">${on ? icon('check') : ''}${DAYS[d].slice(0, 3)}</button>`; }).join('');
  const steps = [2.5, 5, 10].map(v => `<button class="chip${s.step === v ? ' on' : ''}" data-act="stepset" data-v="${v}" aria-pressed="${s.step === v}">${s.step === v ? icon('check') : ''}${v} lb</button>`).join('');
  const th = s.theme || 'light';
  const themes = [['light', 'Light'], ['dark', 'Dark'], ['auto', 'Match iPad']].map(([v, l]) => `<button class="chip${th === v ? ' on' : ''}" data-act="theme" data-v="${v}" aria-pressed="${th === v}">${th === v ? icon('check') : ''}${l}</button>`).join('');
  return `<header class="top"><div class="top-text"><h1>Settings</h1></div></header>
  <section class="card c-gym">${cardHead('gym', 'set', 'Plan')}
    <label class="field"><span class="fl">Start date (Week 1, Day 1)</span><input class="ctl" type="date" data-s="startDate" value="${s.startDate}"></label>
    <label class="field"><span class="fl">Weigh-in day</span><select class="ctl" data-s="weighDay">${DAYS.map((d, i) => `<option value="${i}"${i === Number(s.weighDay) ? ' selected' : ''}>${d}</option>`).join('')}</select></label>
    <div class="field"><span class="fl">Phase</span><div class="seg">${seg}</div><p class="hint">Auto runs Phase 1 for weeks 1 to 4 and Phase 2 from week 5. Pick Phase 3 the week classes start. Changes apply from today on.</p></div>
    <div class="field"><span class="fl">Muay Thai class days (Phase 3)</span><div class="seg">${cls}</div><p class="hint">Phase 3 lifts stay on Monday and Friday. Other days are rest.</p></div>
  </section>
  <section class="card c-cond">${cardHead('cond', 'rest', 'Appearance')}
    <div class="seg">${themes}</div>
    <p class="hint">Light is the default. Match iPad follows your system setting.</p>
  </section>
  <section class="card c-nut">${cardHead('nut', 'nut', 'Tracking')}
    <div class="field"><span class="fl">Water goal</span><div class="nctrl"><button class="minor" data-act="watergoal" data-d="-1" aria-label="Lower water goal">&minus;</button><span class="val" style="align-self:center;min-width:110px;text-align:center">${s.waterGoal} glasses</span><button class="minor" data-act="watergoal" data-d="1" aria-label="Raise water goal">+</button></div></div>
    <div class="field"><span class="fl">Smallest weight jump</span><div class="seg">${steps}</div><p class="hint">Used by the +/&minus; buttons and the "Up a step" suggestion.</p></div>
  </section>
  <section class="card c-home">${cardHead('home', 'save', 'Backup')}
    <p class="note">Everything lives on this iPad only. The Home Screen app and Safari keep separate copies, so log from the icon.${s.lastExport ? ` Last backup: ${fmtShort(s.lastExport)}.` : ''}</p>
    <div class="btnrow"><button class="main" data-act="export">${icon('save')}Export backup</button><button class="ghost" data-act="import">${icon('open')}Import backup</button></div>
  </section>
  <section class="card c-rest">${cardHead('rest', 'undo', 'Start over')}
    <p class="note">Erases all progress and settings on this iPad.</p>
    <button class="ghost danger" data-act="reset">Reset everything</button>
  </section>`;
}

/* ---------- Actions ---------- */
function mutate(fn) {
  const k = state.view, before = isComplete(k);
  const r = recW(k); fn(r, k);
  schedCache = null; keysCache = null;
  save(); render();
  if (!before && isComplete(k) && k === todayKey()) celebrate();
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2600);
}
function celebrate() {
  const n = streak(todayKey());
  const el = document.createElement('div');
  el.className = 'celebrate'; el.setAttribute('role', 'status');
  let conf = '';
  if (!reduce.matches) {
    const cats = ['c-home', 'c-gym', 'c-cond', 'c-nut', 'c-chk'];
    for (let i = 0; i < 28; i++) conf += `<span class="conf ${cats[i % 5]}" style="left:${Math.random() * 100}vw;animation-delay:${(Math.random() * 0.5).toFixed(2)}s"></span>`;
  }
  el.innerHTML = `<div class="cel-card"><div class="cel-big">All done!</div><div>${n > 1 ? `${n} days in a row.` : 'Day 1 of a new streak.'}</div></div>${conf}`;
  el.addEventListener('click', () => el.remove());
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}
function openSheet(html, cls = 'c-gym', btn = 'main') {
  sheet.innerHTML = `<div class="sheet-bg" data-act="close"></div><div class="sheet-panel ${cls}" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">${html}<button class="${btn} block" data-act="close" style="margin-top:10px">Got it</button></div>`;
  sheet.hidden = false;
  sheet.querySelector('.sheet-panel').focus();
}
function openHow(id) {
  const match = i => (i.ex ? i.ex.id : i.id) === id;
  let it, cls;
  if (state.lib) {
    for (const g of libGroups(state.libPhase || Math.min(2, phaseOf(todayKey())))) { it = g.items.find(match); if (it) { cls = 'c-' + g.cat; break; } }
  } else {
    const day = buildDay(state.view);
    it = [...day.home, ...day.gym.items].find(match);
    if (it) cls = day.home.includes(it) ? 'c-home' : 'c-' + day.gym.cat;
  }
  const h = it && howFor(it); if (!h) return;
  const name = it.ex ? it.ex.n : it.n, dose = it.ex ? `${it.ex.sets} × ${it.ex.reps}` : (it.d || '');
  const url = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(h.q);
  openSheet(`<h2 id="sheet-title">${name}</h2>${dose ? `<p class="meta">${dose}</p>` : ''}
    <ol class="how">${h.steps.map(t => `<li>${t}</li>`).join('')}</ol>
    <a class="main block" href="${url}" target="_blank" rel="noopener">${icon('play')}Watch demos</a>
    <p class="hint">Opens a YouTube search, so it needs signal. Clips from physical therapists are usually the safest picks.</p>`, cls, 'ghost');
}
function closeSheet() { sheet.hidden = true; sheet.innerHTML = ''; }
function openRules() {
  openSheet(`<h2 id="sheet-title">The rules</h2>
    <div class="rule c-chk"><span class="badge">${icon('chk')}</span><div><strong>Pain</strong><p>Up to 3/10 is OK if it settles within 24 hours and isn't worse the next morning.</p></div></div>
    <div class="rule c-gym"><span class="badge">${icon('up')}</span><div><strong>Going up</strong><p>When you hit the top of the rep range on every set, add the smallest weight jump. Tap "Top reps every set" and next time starts one step up.</p></div></div>
    <div class="rule c-cond"><span class="badge">${icon('cond')}</span><div><strong>Impact work</strong><p>Only move up a level if knee and ankles are 3/10 or less the next morning.</p></div></div>
    <div class="rule c-rest"><span class="badge">${icon('arrow')}</span><div><strong>Off day?</strong><p>"Move to tomorrow" slides the plan by one day. It catches up on your next rest or walk day, and A and B stay in order.</p></div></div>`);
}
async function exportData() {
  const json = JSON.stringify(data, null, 1), name = `training-backup-${todayKey()}.json`;
  const done = () => { data.settings.lastExport = todayKey(); save(); render(true); toast('Backup saved.'); };
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Training backup' }); done(); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  done();
}
function importData(input) {
  const f = input.files && input.files[0]; input.value = '';
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(rd.result);
      if (!o || typeof o !== 'object' || !o.days || !o.settings) throw new Error('bad');
      if (!confirm('Replace everything on this iPad with this backup?')) return;
      data = merge(o); save(); applyTheme(); state.view = todayKey(); state.tab = 'today'; render(true); toast('Backup restored.');
    } catch (e) { toast("That file isn't a training backup."); }
  };
  rd.readAsText(f);
}
function setPhase(v) {
  const t = todayKey();
  data.settings.phaseLog = (data.settings.phaseLog || []).filter(e => e.from < t).concat([{ from: t, mode: v }]);
  save(); render();
  toast(v === 'auto' ? 'Phase follows the week number.' : `Phase ${v} from today.`);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  switch (act) {
    case 'toggle': state.just = id; mutate(r => { r.c[id] = !r.c[id]; }); break;
    case 'exall': state.just = 'ex_' + id; mutate((r, k) => {
      const ex = findEx(k, id); if (!ex) return;
      const all = isDoneItem({ ex }, r);
      r.sets[id] = Array(ex.sets).fill(!all);
      if (!all) ensureWt(r, k, ex);
    }); break;
    case 'set': mutate((r, k) => {
      const ex = findEx(k, id); if (!ex) return;
      const i = Number(b.dataset.i), a = [];
      for (let j = 0; j < ex.sets; j++) a[j] = !!(r.sets[id] || [])[j];
      a[i] = !a[i]; r.sets[id] = a;
      if (a[i]) ensureWt(r, k, ex);
      if (a.every(Boolean)) state.just = 'ex_' + id;
    }); break;
    case 'wt': mutate((r, k) => { r.wt[id] = Math.max(0, round1(curWeight(id, k, r) + Number(b.dataset.d) * data.settings.step)); }); break;
    case 'top': mutate(r => { r.top[id] = !r.top[id]; }); break;
    case 'protein': mutate(r => { r.protein = clamp((r.protein || 0) + Number(b.dataset.d), 0, 400); }); break;
    case 'water': mutate(r => { r.water = clamp((r.water || 0) + Number(b.dataset.d), 0, 30); }); break;
    case 'sleep': mutate(r => { r.sleep = r.sleep == null ? 7 : clamp(r.sleep + Number(b.dataset.d), 0, 14); }); break;
    case 'checkin': mutate((r, k) => { if (!r.pain) r.pain = { ...painFor(k) }; r.checkin = !r.checkin; }); break;
    case 'move': {
      const t = todayKey();
      if (!data.moved.includes(t)) data.moved.push(t);
      mutate(() => {});
      toast(`Moved. Tomorrow: ${sessionInfo(addDays(t, 1)).label}.`);
      break;
    }
    case 'unmove': data.moved = data.moved.filter(x => x !== todayKey()); mutate(() => {}); break;
    case 'info': openRules(); break;
    case 'how': openHow(id); break;
    case 'lib': state.lib = b.dataset.v === 'true'; state.view = todayKey(); render(true); window.scrollTo(0, 0); break;
    case 'jump': { const el = document.getElementById(b.dataset.v); if (el) el.scrollIntoView({ behavior: reduce.matches ? 'auto' : 'smooth', block: 'start' }); break; }
    case 'libphase': state.libPhase = Number(b.dataset.v); render(true); break;
    case 'close': closeSheet(); break;
    case 'tab':
      state.tab = b.dataset.tab;
      if (state.tab === 'today') { state.view = todayKey(); state.lib = false; }
      render(true); window.scrollTo(0, 0); break;
    case 'openday': state.view = b.dataset.date; state.tab = 'today'; state.lib = false; render(true); window.scrollTo(0, 0); break;
    case 'backtoday': state.view = todayKey(); render(true); window.scrollTo(0, 0); break;
    case 'ready': if (data.readiness[id]) delete data.readiness[id]; else data.readiness[id] = todayKey(); save(); render(); break;
    case 'phase': setPhase(b.dataset.v); break;
    case 'classday': {
      const d = Number(b.dataset.v), cd = data.settings.classDays;
      data.settings.classDays = cd.includes(d) ? cd.filter(x => x !== d) : cd.concat([d]);
      save(); render(); break;
    }
    case 'theme': data.settings.theme = b.dataset.v; save(); applyTheme(); render(); break;
    case 'stepset': data.settings.step = Number(b.dataset.v); save(); render(); break;
    case 'watergoal': data.settings.waterGoal = clamp(data.settings.waterGoal + Number(b.dataset.d), 1, 20); save(); render(); break;
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 'reset':
      if (confirm("Erase all progress and settings on this iPad? Export a backup first if you might want it back.")) {
        data = defaults(); save(); applyTheme(); state.view = todayKey(); state.tab = 'today'; state.ringFrom = {}; render(true); toast('Fresh start.');
      }
      break;
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.wt) { const v = parseFloat(t.value); mutate(r => { if (isNaN(v)) delete r.wt[t.dataset.wt]; else r.wt[t.dataset.wt] = Math.max(0, round1(v)); }); }
  else if (t.dataset.f) { const v = parseFloat(t.value); mutate(r => { r[t.dataset.f] = isNaN(v) ? null : round1(v); }); }
  else if (t.dataset.s) {
    const key = t.dataset.s; let v = t.value;
    if (key === 'startDate' && !/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
    if (key === 'weighDay') v = Number(v);
    data.settings[key] = v; save(); render(true);
  }
  else if (t.id === 'importFile') importData(t);
});

/* Pain sliders: tap anywhere on the track or drag sideways. Vertical swipes still scroll. */
function setSlider(el, x) {
  const tr = el.querySelector('.track').getBoundingClientRect();
  setSliderVal(el, ((x - tr.left) / tr.width) * 10);
}
function setSliderVal(el, raw) {
  const v = clamp(Math.round(raw), 0, 10), key = el.dataset.pain;
  el.style.setProperty('--v', v); el.setAttribute('aria-valuenow', v); el.classList.toggle('hi', v > 3);
  const o = document.getElementById('o_' + key); if (o) o.textContent = v;
  const r = recW(state.view);
  if (!r.pain) r.pain = { ...painFor(state.view) };
  r.pain[key] = v;
  const w = document.getElementById('painwarn'); if (w) w.hidden = !Object.values(r.pain).some(n => n > 3);
}
let drag = null;
document.addEventListener('pointerdown', e => {
  const s = e.target.closest('.slider'); if (!s) return;
  drag = { s, id: e.pointerId, x0: e.clientX, y0: e.clientY, moving: e.pointerType === 'mouse' };
  if (drag.moving) setSlider(s, e.clientX);
});
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moving) {
    const dx = Math.abs(e.clientX - drag.x0), dy = Math.abs(e.clientY - drag.y0);
    if (dx > 6 && dx > dy) { drag.moving = true; try { drag.s.setPointerCapture(e.pointerId); } catch (err) {} } else return;
  }
  setSlider(drag.s, e.clientX);
});
window.addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.id) return;
  setSlider(drag.s, e.clientX);
  drag = null; save(); render();
});
window.addEventListener('pointercancel', () => { drag = null; });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !sheet.hidden) { closeSheet(); return; }
  const s = e.target.closest && e.target.closest('.slider'); if (!s) return;
  const v = Number(s.getAttribute('aria-valuenow'));
  const nv = { ArrowLeft: v - 1, ArrowDown: v - 1, ArrowRight: v + 1, ArrowUp: v + 1, Home: 0, End: 10 }[e.key];
  if (nv == null) return;
  e.preventDefault(); setSliderVal(s, nv); save();
});

/* Day rollover and orientation */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const t = todayKey();
  if (t !== state.today) { state.today = t; state.view = t; render(true); }
});
const onLayout = () => render(true);
if (landscape.addEventListener) landscape.addEventListener('change', onLayout); else if (landscape.addListener) landscape.addListener(onLayout);

/* Home Screen icon: iOS has historically wanted a PNG touch icon, so draw one at runtime too */
try {
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 180); g.addColorStop(0, '#f59e0b'); g.addColorStop(0.5, '#e8505b'); g.addColorStop(1, '#6d28d9');
  x.fillStyle = g; x.fillRect(0, 0, 180, 180);
  x.lineCap = 'round'; x.lineJoin = 'round'; x.lineWidth = 14;
  x.strokeStyle = 'rgba(255,255,255,.35)'; x.beginPath(); x.arc(90, 90, 50, 0, Math.PI * 2); x.stroke();
  x.strokeStyle = '#fff'; x.beginPath(); x.arc(90, 90, 50, -Math.PI / 2, Math.PI); x.stroke();
  x.beginPath(); x.moveTo(68, 92); x.lineTo(84, 108); x.lineTo(114, 74); x.stroke();
  const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.sizes = '180x180'; l.href = c.toDataURL('image/png');
  document.head.appendChild(l);
} catch (e) {}

/* Optional: ask the browser to keep storage, and use sw.js for offline launch if it sits next to this file */
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js')
    .then(() => navigator.serviceWorker.ready)
    .then(reg => { if (reg.active) reg.active.postMessage({ cache: location.href.split('#')[0] }); })
    .catch(() => {});
}

/* Theme: light by default, dark or match-iPad from Settings */
const sysDark = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const t = data.settings.theme || 'light';
  document.documentElement.dataset.theme = t;
  const dark = t === 'dark' || (t === 'auto' && sysDark.matches);
  const m = document.getElementById('themecolor'); if (m) m.content = dark ? '#3b1c2c' : '#ffe2cc';
}
if (sysDark.addEventListener) sysDark.addEventListener('change', applyTheme);

/* Boot */
applyTheme();
$('#tabs').innerHTML = [['today', 'Today', 'today'], ['week', 'Week', 'week'], ['progress', 'Progress', 'prog'], ['settings', 'Settings', 'set']]
  .map(([t, l, i]) => `<button data-act="tab" data-tab="${t}">${icon(i)}<span>${l}</span></button>`).join('');
if (!localStorage.getItem(KEY)) save();
render(true);
})();
</script>
</body>
</html>
