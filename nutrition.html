<style>

<script>
(() => {
'use strict';
const TRACKER_KEY = 'dailyTrainer.v1', TODAY_KEY = 'dailyTrainer.today', KEY = 'knwpFood.v1';
const TRACKER_FILE = 'index.html'; // change this if you renamed the tracker (for example to index.html)
const DAY = 86400000;
const app = document.getElementById('app');

/* ---------- Dates ---------- */
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => keyOf(new Date());
const dayNum = k => { const [y, m, d] = k.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / DAY); };
const keyFromNum = n => { const d = new Date(n * DAY); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
const weekday = k => new Date(dayNum(k) * DAY).getUTCDay();
const sundayOf = k => keyFromNum(dayNum(k) - weekday(k));
const fmtMD = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); };
const fmtLong = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }); };

/* ---------- Data ---------- */
function readJSON(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
const tracker = readJSON(TRACKER_KEY) || {};
const tSettings = tracker.settings || {};
let store = readJSON(KEY) || {};
store.checks = store.checks || {}; store.rot = store.rot || {};
function save() {
  const keep = Object.keys(store.checks).sort().slice(-8), c = {};
  keep.forEach(k => { c[k] = store.checks[k]; });
  store.checks = c;
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
}
function latestWeight() {
  const days = tracker.days || {}, keys = Object.keys(days).sort();
  for (let i = keys.length - 1; i >= 0; i--) if (days[keys[i]].bw != null) return { w: days[keys[i]].bw, k: keys[i] };
  return null;
}

/* ---------- Icons ---------- */
const IC = {

  today: '<rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 3v3M16 3v3"/>',

/* ---------- Menus: 3 rotating weeks so it doesn't get boring ---------- */

  },
  2: {

    groceries: [

const RECIPES = {

const GRAB = [['Greek yogurt cup', 15], ['Cottage cheese, 1 cup', 25], ['Tuna pouch', 17], ['Shake: 1 scoop whey + milk', 30], ['2 eggs', 12]];

/* ---------- Week, menu, today ---------- */
function weekIndex(sunKey) {
  const start = tSettings.startDate || todayKey();
  return Math.floor((dayNum(sunKey) - dayNum(sundayOf(start))) / 7);
}
function menuFor(sunKey) {
  if (store.rot[sunKey]) return store.rot[sunKey];
  const i = Math.max(0, weekIndex(sunKey));
  return (i % 3) + 1;
}
function todaySession() {
  const t = readJSON(TODAY_KEY);
  if (t && t.date === todayKey()) return t;
  return null;
}
const TRAIN = ['lift', 'cond', 'class'];

/* ---------- State ---------- */
const state = { tab: 'today', week: 'this', dayOverride: null };
const curSun = () => sundayOf(todayKey());
const nextSun = () => keyFromNum(dayNum(curSun()) + 7);
const selSun = () => (state.week === 'next' ? nextSun() : curSun());
function checks(sun) { return store.checks[sun] || (store.checks[sun] = { g: {}, p: {} }); }

/* ---------- Views ---------- */
function render() {
  const tabs = [['today', 'Today', 'today'], ['groceries', 'Groceries', 'cart'], ['prep', 'Prep', 'prep'], ['recipes', 'Recipes', 'book'], ['guide', 'Guide', 'guide']];
  app.innerHTML = `<header class="top"><a class="back" href="${TRACKER_FILE}" data-act="back">${icon('back')}Tracker</a><h1>Fuel</h1></header>
    <nav class="tabs" aria-label="Sections">${tabs.map(([t, l, i]) => `<button data-act="tab" data-tab="${t}" aria-current="${state.tab === t ? 'page' : 'false'}">${icon(i)}${l}</button>`).join('')}</nav>
    ${({ today: vToday, groceries: vGroceries, prep: vPrep, recipes: vRecipes, guide: vGuide })[state.tab]()}`;
}

function vToday() {
  const k = todayKey(), wd = weekday(k), sess = todaySession();
  const m = MENUS[menuFor(curSun())];
  let kind = state.dayOverride || (sess ? (TRAIN.includes(sess.type) ? (sess.type === 'class' ? 'class' : 'train') : 'rest') : null);
  const bowl = (wd >= 1 && wd <= 3) || wd === 0 ? m.a : m.b;
  const bfast = wd >= 1 && wd <= 4 ? ['Overnight oats jar', 50] : ['4 egg bites + fruit', 40];
  const head = `<p class="meta">${fmtLong(k)}</p>`;
  if (!kind) {
    return head + `<section class="card c-nut"><h2 class="card-h"><span class="badge">${icon('nut')}</span>What kind of day?</h2>
      <p class="note">Open the tracker first and this picks it up on its own. Or choose:</p>
      <div class="seg"><button class="chip" data-act="day" data-v="train">Training day</button><button class="chip" data-act="day" data-v="class">Muay Thai class</button><button class="chip" data-act="day" data-v="rest">Rest day</button></div></section>`;
  }
  const label = sess && !state.dayOverride ? sess.label : ({ train: 'Training day', class: 'Muay Thai class', rest: 'Rest day' })[kind];
  const cat = kind === 'rest' ? 'c-rest' : kind === 'class' ? 'c-cond' : 'c-gym';
  const ic = kind === 'rest' ? 'rest' : kind === 'class' ? 'glove' : 'gym';
  let meals;
  if (kind === 'rest') meals = [
    ['Breakfast', bfast[0], bfast[1]],
    ['Lunch', `${bowl}, 1 fist of carbs`, 45],
    ['Afternoon', 'Cottage cheese or a tuna pouch', 20],
    ['Dinner', `${bowl}, 1 fist of carbs`, 45]
  ];
  else if (kind === 'class') meals = [
    ['Breakfast', bfast[0], bfast[1]],
    ['Lunch', `${bowl}, 2 fists of carbs`, 45],
    ['2 to 3 h before class', 'Light: banana + Greek yogurt cup. Nothing heavy after this.', 15],
    ['After class', 'Shake + water. Salt your next meal.', 30],
    ['Dinner', `${bowl}, 2 fists of carbs`, 45]
  ];
  else meals = [
    ['Breakfast', bfast[0], bfast[1]],
    ['1 to 2 h before training', 'Banana + Greek yogurt cup', 15],
    ['Lunch', `${bowl}, 2 fists of carbs`, 45],
    ['After training', 'Shake: 1 scoop whey + milk', 30],
    ['Dinner', `${bowl}, 2 fists of carbs`, 45]
  ];
  const total = meals.reduce((a, x) => a + x[2], 0);
  const chips = g => Math.max(1, Math.round(g / 25));
  return head + `<p style="margin:6px 0 14px" class="${cat}"><span class="pill">${icon(ic)}${label}</span></p>
    <div class="cols"><section class="card ${cat}"><h2 class="card-h"><span class="badge">${icon('today')}</span>Today's eating</h2>
      <ul class="meals">${meals.map(([w, f, g]) => `<li class="meal"><div><div class="when">${w}</div><div class="what">${f}</div></div><div class="pro">≈${g} g<small>${chips(g)} chip${chips(g) > 1 ? 's' : ''}</small></div></li>`).join('')}</ul>
      <div class="total"><span>Protein</span><span>≈${total} g of 150 to 190</span></div>
      <p class="note" style="margin-top:10px">Each "chip" is one +25 g tap in the tracker. ${kind !== 'rest' ? 'Train in the morning? Move the pre-training snack before it and eat lunch after.' : 'Lighter on carbs today, same protein.'}</p>
      ${sess ? '' : `<div class="seg" style="margin-top:6px"><button class="chip" data-act="day" data-v="">Change day type</button></div>`}
    </section>
    <section class="card c-nut"><h2 class="card-h"><span class="badge">${icon('nut')}</span>This week's menu</h2>
      <p><b>${m.name}</b></p>
      <p class="note" style="margin-top:6px">Sunday to Wednesday: ${m.a}. Thursday to Saturday: ${m.b}. Two meals a week are yours, eat whatever, no guilt.</p>
      <h4 class="when" style="margin-top:12px">If you are hungry</h4>
      <ul class="meals" style="margin-top:6px">${GRAB.map(([n, g]) => `<li class="meal"><div class="what">${n}</div><div class="pro">≈${g} g</div></li>`).join('')}</ul>
    </section></div>`;
}

function grocItems(menu) {
  return STAPLES.map(([id, n, q, a]) => ({ id: 's_' + id, n, q, a })).concat(MENUS[menu].groceries.map(([id, n, q, a]) => ({ id: 'm' + menu + '_' + id, n, q, a })));
}
function weekPicker() {
  const cur = curSun(), nx = nextSun();
  return `<div class="seg c-nut">
    <button class="chip${state.week === 'this' ? ' on' : ''}" data-act="week" data-v="this" aria-pressed="${state.week === 'this'}">This week · Menu ${menuFor(cur)}</button>
    <button class="chip${state.week === 'next' ? ' on' : ''}" data-act="week" data-v="next" aria-pressed="${state.week === 'next'}">Next week · Menu ${menuFor(nx)}</button></div>
    <div class="seg c-nut"><span class="meta" style="align-self:center">Swap menu:</span>${[1, 2, 3].map(n => `<button class="chip${menuFor(selSun()) === n ? ' on' : ''}" data-act="menu" data-v="${n}" aria-pressed="${menuFor(selSun()) === n}">${n}</button>`).join('')}</div>`;
}
function checkRow(id, n, q, done, act) {
  return `<li class="item${done ? ' done' : ''}"><button class="row" data-act="${act}" data-id="${id}" aria-pressed="${done}"><span class="box">${icon('check')}</span><span class="txt"><span class="nm">${n}</span>${q ? `<span class="qty">${q}</span>` : ''}</span></button></li>`;
}
function vGroceries() {
  const sun = selSun(), menu = menuFor(sun), c = checks(sun).g, items = grocItems(menu);
  const left = items.filter(i => !c[i.id]).length;
  let body = '';
  AISLES.forEach(a => {
    const its = items.filter(i => i.a === a).sort((x, y) => (c[x.id] ? 1 : 0) - (c[y.id] ? 1 : 0));
    if (!its.length) return;
    body += `<h3 class="aisle">${a}</h3><ul class="list">${its.map(i => checkRow(i.id, i.n, i.q, !!c[i.id], 'g')).join('')}</ul>`;
  });
  return weekPicker() + `<section class="card c-nut"><h2 class="card-h"><span class="badge">${icon('cart')}</span>Groceries<span class="count">${left} left</span></h2>
    <p class="note">${MENUS[menu].name}. Week of ${fmtMD(sun)}. Check the "at home first" stuff before you go.</p>
    ${body}
    <div class="btnrow"><button class="main" data-act="copy">${icon('copy')}Copy what's left</button><button class="ghost" data-act="cleargroc">${icon('undo')}Clear checks</button></div>
  </section>`;
}
function prepSteps(menu) {
  const m = MENUS[menu];
  return {
    sun: [
      ['s1', 'Oven to 425°F. Start 3 cups of dry rice.'],
      ['s2', m.sunMain],
      ['s3', 'Frozen veg on a second pan with oil and salt, roast about 20 min.'],
      ['s4', 'Make 4 overnight oats jars while things cook.'],
      ['s5', 'Portion 7 containers: protein, rice, veg. Into the fridge.']
    ],
    wed: [
      ['w1', m.wedMain],
      ['w2', menu === 3 ? 'Pasta is your carb this time. Skip the rice.' : 'Start 2 cups of dry rice.'],
      ['w3', 'Egg bites: 12 in a muffin tin.'],
      ['w4', 'Portion 5 containers. Fridge.']
    ]
  };
}
function vPrep() {
  const sun = selSun(), menu = menuFor(sun), c = checks(sun).p, s = prepSteps(menu);
  const block = (title, sub, steps, cat) => {
    const dn = steps.filter(([id]) => c[id]).length;
    return `<section class="card ${cat}"><h2 class="card-h"><span class="badge">${icon('prep')}</span>${title}<span class="count">${dn}/${steps.length}</span></h2>
      <p class="note">${sub}</p><ul class="list">${steps.map(([id, t]) => checkRow(id, t, '', !!c[id], 'p')).join('')}</ul></section>`;
  };
  return weekPicker() + `<p class="note">Starting mid-week? Do the Sunday prep today, then Wednesday's whenever the first batch runs out. Cooked food is good 3 to 4 days in the fridge, that's why it's two preps.</p>
    <div class="cols">${block('Sunday prep', 'About 75 to 90 min. Covers Sunday dinner through Wednesday.', s.sun, 'c-home')}
    ${block('Wednesday prep', 'About 45 min. Covers Thursday through Saturday.', s.wed, 'c-gym')}</div>`;
}
function recipeCard(id, cat) {
  const r = RECIPES[id];
  return `<section class="card recipe ${cat}"><h3>${r.n}</h3>
    <div class="facts"><span class="fact">${r.y}</span><span class="fact">≈${r.p} g protein each</span><span class="fact">${Math.round(r.p / 25)} chips</span></div>
    <h4>You need</h4><ul>${r.ing.map(i => `<li>${i}</li>`).join('')}</ul>
    <h4>Steps</h4><ol>${r.steps.map(t => `<li>${t}</li>`).join('')}</ol></section>`;
}
function vRecipes() {
  const menu = menuFor(selSun()), m = MENUS[menu];
  return weekPicker() + `<div class="cols"><div>${recipeCard(m.recipes[0], 'c-home')}${recipeCard('oats', 'c-nut')}</div><div>${recipeCard(m.recipes[1], 'c-gym')}${recipeCard('bites', 'c-chk')}</div></div>
    <p class="note">Protein numbers are estimates. Labels vary by brand.</p>`;
}
function vGuide() {
  const lw = latestWeight();
  const calc = lw
    ? (() => { const w = lw.w, lo = Math.round(w * 14 / 50) * 50, hi = Math.round(w * 16 / 50) * 50; return `<div class="calc"><p class="meta">From your weigh-in on ${fmtMD(lw.k)} (${w} lb)</p>
        <p class="big">Maintain: about ${lo.toLocaleString()} to ${hi.toLocaleString()} cal</p>
        <p class="big">Lean out: about ${(lo - 400).toLocaleString()} to ${(hi - 400).toLocaleString()} cal</p>
        <p class="meta" style="margin-top:6px">Rough starting point (body weight × 14 to 16, minus about 400 to lean out). Your waist trend is the real judge.</p></div>`; })()
    : `<div class="calc"><p>Log a weekly weigh-in in the tracker and a rough calorie range shows up here.</p></div>`;
  return `<div class="cols guide"><div>
    <section class="card c-nut"><h2 class="card-h"><span class="badge">${icon('nut')}</span>Build a plate</h2>
      <p>No counting needed. Use your hand.</p>
      <div class="handgrid"><div class="hand"><b>Protein</b>2 palms</div><div class="hand"><b>Veg</b>2 fists</div><div class="hand"><b>Carbs</b>2 fists on training days, 1 on rest days</div><div class="hand"><b>Fat</b>1 thumb (oil, cheese, sauce)</div></div></section>
    <section class="card c-gym"><h2 class="card-h"><span class="badge">${icon('gym')}</span>By phase</h2><ul>
      <li><b>Phase 1:</b> lock in protein and water. Don't slash food while you rehab; under-eating slows recovery.</li>
      <li><b>Phase 2:</b> the bike intervals and impact work need fuel. Eat carbs 1 to 2 hours before hard days.</li>
      <li><b>Phase 3:</b> light meal 2 to 3 hours before class, nothing heavy after that. After class: shake, water, salt your food. Extra fist of carbs on class days.</li></ul></section>
    <section class="card c-chk"><h2 class="card-h"><span class="badge">${icon('guide')}</span>Steer by your waist</h2>
      <p>Check the waist line on the Progress tab every 2 weeks.</p><ul>
      <li>Going down slowly: keep doing what you're doing.</li>
      <li>Flat for 3 weeks and you want it lower: drop the dinner carbs to 1 fist on rest days.</li>
      <li>Workouts feel flat, or the scale drops more than about 1% of your weight a week: add a fist of carbs back.</li></ul>${calc}</section>
  </div><div>
    <section class="card c-cond"><h2 class="card-h"><span class="badge">${icon('cond')}</span>Water</h2><ul>
      <li>Hit the glass goal in the tracker. Pale yellow pee means you're good.</li>
      <li>Add a glass or two on sauna days and class days. Heavy sweat days, salt your food.</li></ul></section>
    <section class="card c-home"><h2 class="card-h"><span class="badge">${icon('undo')}</span>Swaps</h2><ul>
      <li>Turkey or beef: swap either way.</li>
      <li>Chicken breast and thighs: swap either way. Thighs are cheaper and harder to dry out.</li>
      <li>Rice, potatoes, tortillas, pasta: all count as a carb fist.</li>
      <li>Sick of oats: eggs and toast. Out of whey: an extra cup of Greek yogurt.</li></ul></section>
    <section class="card c-rest"><h2 class="card-h"><span class="badge">${icon('rest')}</span>Good to know</h2><ul>
      <li>Cooked food: 3 to 4 days in the fridge. Freeze anything you won't get to.</li>
      <li>Done temps: chicken and turkey 165°F, ground beef 160°F.</li>
      <li>Cheaper: family packs, store brands, frozen veg and frozen berries.</li>
      <li>Optional: creatine monohydrate, 3 to 5 g a day, is the most studied strength supplement. Ask your doctor first if you have kidney issues.</li></ul></section>
  </div></div>`;
}

/* ---------- Actions ---------- */
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }
async function copyList() {
  const sun = selSun(), c = checks(sun).g;
  const text = grocItems(menuFor(sun)).filter(i => !c[i.id]).map(i => i.q ? `${i.n}, ${i.q}` : i.n).join('\n');
  try { await navigator.clipboard.writeText(text); toast('Copied. Paste it into Notes or Reminders.'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied.'); } catch (err) { toast('Copy did not work here.'); }
    ta.remove();
  }
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'back') {
    if (document.referrer && document.referrer.indexOf(location.origin) === 0 && history.length > 1) { e.preventDefault(); history.back(); }
    return;
  }
  if (a === 'tab') { state.tab = b.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (a === 'week') state.week = b.dataset.v;
  else if (a === 'menu') { store.rot[selSun()] = Number(b.dataset.v); save(); }
  else if (a === 'day') state.dayOverride = b.dataset.v || null;
  else if (a === 'g' || a === 'p') { const c = checks(selSun())[a]; c[b.dataset.id] = !c[b.dataset.id]; save(); }
  else if (a === 'cleargroc') { checks(selSun()).g = {}; save(); }
  else if (a === 'copy') { copyList(); return; }
  render();
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') render(); });
try {
  const t = tSettings.theme || 'light';
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.getElementById('themecolor').content = dark ? '#3b1c2c' : '#ffe2cc';
} catch (e) {}
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready)
    .then(reg => { if (reg.active) reg.active.postMessage({ cache: location.href.split('#')[0] }); }).catch(() => {});
}
render();
})();
</script>
</body>
</html>
